<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學習精靈 精靈圖鑑</title>
<style>
body{margin:0;background:#f6f1e7;color:#2d2a26;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:24px}
h1{font-size:22px;margin:0 0 4px}
.lead{color:#7a7268;font-size:14px;margin:0 0 20px;line-height:1.7;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.sp{background:#fffdf8;border:1px solid #e4dccd;border-radius:14px;padding:12px 14px}
.h{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.tag{color:#fff;font-size:12px;padding:2px 9px;border-radius:99px}
.role{font-size:13px;color:#7a7268}
.st{display:flex;align-items:center;justify-content:space-between}
figure{margin:0;text-align:center}
figure img{width:120px;height:120px;object-fit:contain;display:block;margin:0 auto}
figcaption{font-size:14px;display:flex;flex-direction:column;font-weight:600}
figcaption span{font-size:11px;color:#7a7268;font-weight:400}
.ar{color:#c9bca5;font-size:20px}
@media (max-width:480px){body{padding:16px}.grid{grid-template-columns:1fr}figure img{width:84px;height:84px}}
</style>
</head>
<body>
<h1>🐾 學習精靈 精靈圖鑑</h1>
<p class="lead">12 種原創精靈 × 3 個進化階段。圖檔在 <code>spirits/</code>（去背 PNG，檔名為「英文代號-階段」）。技能是暫定，等團隊定案再改。</p>
<div class="grid" id="grid"></div>
<script>
const CATS = {
  food: ['食物', '#d9822b'], nature: ['自然', '#3f8f4f'], body: ['身體與健康', '#c2507a'],
  life: ['生活', '#7a62b8'], society: ['社會與工作', '#3a6fc2'], general: ['通用', '#7a7268'],
};
const SPECIES = [
  ['onigiri', 'food', '近戰坦克 · 暖胃護盾', ['糰糰', '飯盒獸', '御膳獸']],
  ['berry', 'food', '遠程 · 果汁噴射', ['莓莓', '串串莓', '葡萄王']],
  ['sprout', 'nature', '治療 · 光合治癒', ['芽芽', '葉葉', '大樹爺']],
  ['cloud', 'nature', '遠程控制 · 雷雨', ['雲朵', '雨雲', '雷雲']],
  ['heart', 'body', '輔助 · 心跳加速', ['噗通', '怦怦', '心跳獸']],
  ['fist', 'body', '近戰輸出 · 重拳', ['拳拳', '肌肌', '鋼鐵臂']],
  ['lamp', 'life', '遠程控制 · 強光', ['燈燈', '燭燭', '燈籠仙']],
  ['teddy', 'life', '近戰坦克 · 軟綿綿', ['抱抱熊', '沙發獸', '小屋守衛']],
  ['letter', 'society', '遠程狙擊 · 急件', ['信信', '快遞鴿', '郵筒長']],
  ['gear', 'society', '近戰輸出 · 加班', ['齒輪', '扳手', '工程獸']],
  ['abc', 'general', '遠程範圍 · 單字風暴', ['字靈', '書靈', '典靈']],
  ['star', 'general', '治療 · 祝福', ['星星', '亮星', '流星']],
];
document.getElementById('grid').innerHTML = SPECIES.map(([id, cat, role, names]) => `
  <div class="sp">
    <div class="h"><span class="tag" style="background:${CATS[cat][1]}">${CATS[cat][0]}</span><span class="role">${role}</span></div>
    <div class="st">${names.map((n, i) => `${i ? '<span class="ar">→</span>' : ''}
      <figure><img src="spirits/${id}-${i + 1}.png" alt="${n}"><figcaption>${n}<span>第 ${i + 1} 階</span></figcaption></figure>`).join('')}
    </div>
  </div>`).join('');
</script>
</body>
</html>
